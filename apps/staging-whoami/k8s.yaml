apiVersion: v1
kind: ServiceAccount
metadata:
  name: whoami-sa
  namespace: staging
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: whoami
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: whoami-sa
      automountServiceAccountToken: false
      containers:
      - name: whoami
        image: traefik/whoami:v1.10.1
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "300m"
            memory: "384Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"

---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: staging
spec:
  selector:
    app: whoami
  ports:
  - name: http
    port: 80
    targetPort: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-route
  namespace: staging
spec:
  parentRefs:
  - name: infra-gateway
    namespace: infra
  hostnames:
  - "test.wminor.xyz"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: whoami
      port: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: whoami-hpa
  namespace: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whoami
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: whoami-pdb
  namespace: staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: whoami
