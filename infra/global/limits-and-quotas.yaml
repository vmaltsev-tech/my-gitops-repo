apiVersion: v1
kind: LimitRange
metadata:
  name: prod-default-limits
  namespace: prod
spec:
  limits:
  - type: Container
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    max:
      cpu: "2000m"
      memory: "2Gi"
    min:
      cpu: "50m"
      memory: "128Mi"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-quota
  namespace: prod
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "100"
    services: "50"
    configmaps: "100"
    secrets: "200"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-default-limits
  namespace: staging
spec:
  limits:
  - type: Container
    default:
      cpu: "300m"
      memory: "384Mi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    max:
      cpu: "1000m"
      memory: "1Gi"
    min:
      cpu: "50m"
      memory: "128Mi"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: staging
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "4Gi"
    limits.cpu: "4"
    limits.memory: "8Gi"
    pods: "50"
    services: "30"
    configmaps: "100"
    secrets: "200"
